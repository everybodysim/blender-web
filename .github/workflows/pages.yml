name: Deploy Blender Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hardware-verified Blender Web release
        run: |
          curl -fL --retry 3 "https://github.com/gessa-ai/blender-web/releases/download/v0.1.1/blender-web-local-v0.1.1.tar.gz" -o blender-web.tar.gz
          echo "1af405cd00d3471e105a39dad24a628aeb988f77b372c4c21bbf85ccbdca2ee0  blender-web.tar.gz" | sha256sum -c -

      - name: Extract release and assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf unpack site
          mkdir unpack site
          tar -xzf blender-web.tar.gz -C unpack
          SHELL_DIR="$(find unpack -type d -name shell -print -quit)"
          test -n "$SHELL_DIR" && test -f "$SHELL_DIR/index.html"
          RELEASE_ROOT="$(dirname "$SHELL_DIR")"
          cp -a "$SHELL_DIR/." site/
          if [[ -d "$RELEASE_ROOT/bin" ]]; then cp -a "$RELEASE_ROOT/bin" site/bin; fi
          for dir in assets data lib wasm; do
            if [[ -d "$RELEASE_ROOT/$dir" && ! -e "site/$dir" ]]; then cp -a "$RELEASE_ROOT/$dir" "site/$dir"; fi
          done

          test -f site/windowed.html
          test -f site/boot-windowed.js
          cp site/windowed.html site/index.html
          test -f site/index.html
          test -d site/bin
          test -f site/bin/blender_browser.js

      - name: Install COOP/COEP service worker correctly
        run: |
          cp coi-serviceworker.js site/coi-serviceworker.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          registration = '''<script>
          (function () {
            if (!window.isSecureContext || !("serviceWorker" in navigator)) return;
            navigator.serviceWorker.register("./coi-serviceworker.js", {scope: "./"})
              .then(function () {
                if (!navigator.serviceWorker.controller) window.location.reload();
              })
              .catch(function (err) { console.error("COOP/COEP service worker registration failed:", err); });
          })();
          </script>'''
          if "navigator.serviceWorker.register" not in text:
              text = text.replace('</head>', registration + '\n</head>', 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Make the release launcher Pages-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          if '<base href="./">' not in text:
              text = text.replace('<head>', '<head>\n<base href="./">', 1)

          replacements = {
              'src="/diagnostics-bootstrap.js"': 'src="./diagnostics-bootstrap.js"',
              'src="/bin/blender_browser.js"': 'src="./bin/blender_browser.js"',
              'src="/file-bridge.js"': 'src="./file-bridge.js"',
              'src="/boot-windowed.js"': 'src="./boot-windowed.js"',
              'src="/boot.js"': 'src="./boot.js"',
              'href="/fonts/': 'href="./fonts/',
              'src="/fonts/': 'src="./fonts/',
              'href="/favicon.ico"': 'href="./favicon.ico"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          diagnostics = '''<script>
          (function () {
            function report(kind, value) {
              try {
                var msg = "[browser] " + kind + ": " + (value && value.stack ? value.stack : String(value));
                console.error(msg);
                var box = document.getElementById("bw-error");
                if (!box) {
                  box = document.createElement("pre");
                  box.id = "bw-error";
                  box.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483647;max-height:35vh;overflow:auto;margin:0;padding:12px;background:#320f0f;color:#ffd5d5;border:1px solid #d66;border-radius:8px;font:12px/1.45 monospace;white-space:pre-wrap";
                  document.body.appendChild(box);
                }
                box.textContent = msg;
              } catch (_) {}
            }
            window.addEventListener("error", function (e) { report("error", e.error || e.message); });
            window.addEventListener("unhandledrejection", function (e) { report("unhandled rejection", e.reason); });
          })();
          </script>'''
          if 'id="bw-error"' not in text:
              text = text.replace('</body>', diagnostics + '\n</body>', 1)
          p.write_text(text, encoding="utf-8")

          for p in Path("site").rglob("*.js"):
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              text = text.replace('const BIN_PREFIX = "/bin/";', 'const BIN_PREFIX = new URL("./bin/", document.baseURI).href;')
              text = text.replace('"/bin/', '"./bin/').replace("'/bin/", "'./bin/")
              text = text.replace('"/boot.js"', '"./boot.js"').replace("'/boot.js'", "'./boot.js'")
              p.write_text(text, encoding="utf-8")
          PY

      - name: Verify the actual interactive launcher
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/windowed.html
          test -f site/boot-windowed.js
          test -f site/bin/blender_browser.js
          grep -q '<base href="./">' site/index.html
          grep -q 'id="canvas"' site/index.html
          grep -q 'src="./boot-windowed.js"' site/index.html
          grep -q 'const ARGV = \[' site/boot-windowed.js
          grep -q '"--factory-startup"' site/boot-windowed.js
          ! grep -q 'id="run" class="' site/index.html
          echo "Verified: Pages uses the interactive windowed Blender launcher"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
