name: Deploy Blender Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hardware-verified Blender Web release
        run: |
          curl -fL --retry 3 "https://github.com/gessa-ai/blender-web/releases/download/v0.1.1/blender-web-local-v0.1.1.tar.gz" -o blender-web.tar.gz
          echo "1af405cd00d3471e105a39dad24a628aeb988f77b372c4c21bbf85ccbdca2ee0  blender-web.tar.gz" | sha256sum -c -

      - name: Extract release and assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf unpack site
          mkdir unpack site
          tar -xzf blender-web.tar.gz -C unpack
          SHELL_DIR="$(find unpack -type d -name shell -print -quit)"
          test -n "$SHELL_DIR" && test -f "$SHELL_DIR/index.html"
          RELEASE_ROOT="$(dirname "$SHELL_DIR")"
          cp -a "$SHELL_DIR/." site/
          if [[ -d "$RELEASE_ROOT/bin" ]]; then cp -a "$RELEASE_ROOT/bin" site/bin; fi
          for dir in assets data lib wasm; do
            if [[ -d "$RELEASE_ROOT/$dir" && ! -e "site/$dir" ]]; then cp -a "$RELEASE_ROOT/$dir" "site/$dir"; fi
          done
          test -f site/index.html
          test -d site/bin
          test -f site/boot.js

      - name: Install COOP/COEP service worker correctly
        run: |
          cp coi-serviceworker.js site/coi-serviceworker.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          text = text.replace('<script src="./coi-serviceworker.js"></script>', '')
          registration = '''<script>
          (function () {
            if (!window.isSecureContext || !('serviceWorker' in navigator)) return;
            navigator.serviceWorker.register('./coi-serviceworker.js', {scope: './'})
              .then(function () {
                if (!navigator.serviceWorker.controller) window.location.reload();
              })
              .catch(function (err) { console.error('COOP/COEP service worker registration failed:', err); });
          })();
          </script>'''
          if 'navigator.serviceWorker.register' not in text:
              text = text.replace('</head>', registration + '\n</head>', 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Fix GitHub Pages relative runtime paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path("site/index.html")
          text = index.read_text(encoding="utf-8")
          for old, new in {
              '<script src="/boot.js"></script>': '<script src="./boot.js"></script>',
              '<script src="/bin/blender_browser.js"></script>': '<script src="./bin/blender_browser.js"></script>',
              'href="/favicon.ico"': 'href="./favicon.ico"',
          }.items(): text = text.replace(old, new)
          index.write_text(text, encoding="utf-8")
          for p in Path("site").rglob("*.js"):
              try: text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError: continue
              text = text.replace('const BIN_PREFIX = "/bin/";', 'const BIN_PREFIX = new URL("./bin/", document.baseURI).href;')
              text = text.replace('"/bin/', '"./bin/').replace("'/bin/", "'./bin/")
              text = text.replace('"/boot.js"', '"./boot.js"').replace("'/boot.js'", "'./boot.js'")
              p.write_text(text, encoding="utf-8")
          PY

      - name: Add GitHub Pages base-path compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          if '<base href="./">' not in text and '<head>' in text:
              text = text.replace('<head>', '<head>\n    <base href="./">', 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Add pthread canvas compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          if 'id="canvas"' not in text:
              text = text.replace('<body>', '<body>\n    <canvas id="canvas" aria-hidden="true" style="display:none"></canvas>', 1)
          marker = '<script src="./bin/blender_browser.js"></script>'
          bootstrap = '''<script>
          // Emscripten's pthread startup expects the canvas selector #canvas to exist.
          // Keep it hidden: Blender is still launched in background/headless mode.
          window.Module = window.Module || {};
          window.Module.canvas = document.getElementById('canvas');
          </script>'''
          if "window.Module.canvas = document.getElementById('canvas')" not in text and marker in text:
              text = text.replace(marker, bootstrap + '\n    ' + marker, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Verify generated Pages artifact
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/bin/blender_browser.js
          test -f site/boot.js
          grep -q "navigator.serviceWorker.register" site/index.html
          grep -q '<script src="./boot.js"></script>' site/index.html
          grep -q '<script src="./bin/blender_browser.js"></script>' site/index.html
          grep -q 'id="canvas"' site/index.html
          grep -q "window.Module.canvas = document.getElementById('canvas')" site/index.html
          ! grep -R 'src="/bin/' site --include='*.html' --include='*.js'
          ! grep -R 'src="/boot.js"' site --include='*.html' --include='*.js'
          echo "Pages artifact checks passed"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
