name: Deploy Blender Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hardware-verified Blender Web release
        run: |
          curl -fL --retry 3 "https://github.com/gessa-ai/blender-web/releases/download/v0.1.1/blender-web-local-v0.1.1.tar.gz" -o blender-web.tar.gz
          echo "1af405cd00d3471e105a39dad24a628aeb988f77b372c4c21bbf85ccbdca2ee0  blender-web.tar.gz" | sha256sum -c -

      - name: Extract release and assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf unpack site
          mkdir unpack site
          tar -xzf blender-web.tar.gz -C unpack
          SHELL_DIR="$(find unpack -type d -name shell -print -quit)"
          test -n "$SHELL_DIR" && test -f "$SHELL_DIR/index.html"
          RELEASE_ROOT="$(dirname "$SHELL_DIR")"
          cp -a "$SHELL_DIR/." site/
          if [[ -d "$RELEASE_ROOT/bin" ]]; then cp -a "$RELEASE_ROOT/bin" site/bin; fi
          for dir in assets data lib wasm; do
            if [[ -d "$RELEASE_ROOT/$dir" && ! -e "site/$dir" ]]; then cp -a "$RELEASE_ROOT/$dir" "site/$dir"; fi
          done

          test -f site/windowed.html
          test -f site/boot-windowed.js
          cp site/windowed.html site/index.html
          test -f site/index.html
          test -d site/bin
          test -f site/bin/blender_browser.js

      - name: Install COOP/COEP service worker correctly
        run: |
          cp coi-serviceworker.js site/coi-serviceworker.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          registration = '''<script>
          (function () {
            if (!window.isSecureContext || !("serviceWorker" in navigator)) return;
            navigator.serviceWorker.register("./coi-serviceworker.js", {scope: "./"})
              .then(function () {
                if (!navigator.serviceWorker.controller) window.location.reload();
              })
              .catch(function (err) { console.error("COOP/COEP service worker registration failed:", err); });
          })();
          </script>'''
          if "navigator.serviceWorker.register" not in text:
              text = text.replace('</head>', registration + '\n</head>', 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Make the release launcher Pages-safe and add WebGPU crash mitigations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          if '<base href="./">' not in text:
              text = text.replace('<head>', '<head>\n<base href="./">', 1)

          replacements = {
              'src="/diagnostics-bootstrap.js"': 'src="./diagnostics-bootstrap.js"',
              'src="/bin/blender_browser.js"': 'src="./bin/blender_browser.js"',
              'src="/file-bridge.js"': 'src="./file-bridge.js"',
              'src="/boot-windowed.js"': 'src="./boot-windowed.js"',
              'src="/boot.js"': 'src="./boot.js"',
              'href="/fonts/': 'href="./fonts/',
              'src="/fonts/': 'src="./fonts/',
              'href="/favicon.ico"': 'href="./favicon.ico"',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # =========================================================================
          # Site-level hardening for the shipped v0.1.1 wasm binary. That binary
          # still carries the upstream P0 present/selection memory-safety bugs
          # (never fixed in a released build); on Windows/D3D it traps with
          # "memory access out of bounds" within seconds and every further input
          # event re-enters the corrupted module until the tab hangs. The real fix
          # needs a relink, which cannot happen from this repo - so this step
          # ships the strongest site-level mitigations instead:
          #
          # (1) Gate mode stays OFF by default (full-window, native feel); ?gate=WxH
          #     remains a manual stability/diagnostic mode.
          # (2) CRASH OVERLAY. A fatal wasm trap corrupts linear memory
          #     permanently; the only safe recovery is a fresh page load. The
          #     overlay detects the first trap (main-thread errors AND worker
          #     aborts via the shell onAbort/onExit hooks patched below), stops
          #     feeding the module input, kills all main-thread timers (the
          #     post-trap error spam that makes the page crawl), self-heals once
          #     per 10 minutes with an automatic reload, and otherwise shows a
          #     one-click Reload panel with the trap reason.
          # (3) WEBGPU GATE PANEL. Visitors without WebGPU (or with it disabled)
          #     get a clear "this device can't run it" panel instead of a
          #     silent black boot failure.
          # =========================================================================
          hardening = '''<script>
          (function () {
            var recovered = false;
            // (3) probe adapter availability early (separate from the worker's
            //     own preinit; Chrome allows many requestAdapter calls)
            try {
              if (window.navigator && navigator.gpu && navigator.gpu.requestAdapter) {
                navigator.gpu.requestAdapter().then(function (a) {
                  window.__bwAdapterOK = !!a;
                }, function () { window.__bwAdapterOK = false; });
              } else {
                window.__bwAdapterOK = false;
              }
            } catch (_) {}

            function killTimers() {
              try {
                var id = setTimeout(function () {}, 0);
                while (id > 0) { clearTimeout(id); clearInterval(id); id -= 1; }
              } catch (_) {}
            }
            function blockInput() {
              try {
                var blocker = function (e) { e.stopPropagation(); e.preventDefault(); };
                ["mousedown", "mouseup", "mousemove", "wheel", "keydown", "keyup", "click", "touchstart", "touchmove", "contextmenu"].forEach(function (evt) {
                  window.addEventListener(evt, blocker, true);
                });
                var canvas = document.getElementById("canvas");
                if (canvas) {
                  canvas.style.pointerEvents = "none";
                  canvas.style.filter = "blur(2px) brightness(0.6)";
                }
              } catch (_) {}
            }
            function panel(inner) {
              var overlay = document.createElement("div");
              overlay.id = "bw-crash-overlay";
              overlay.style.cssText = "position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:rgba(10,10,12,0.72);font:15px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#eee;text-align:center;";
              overlay.innerHTML = '<div style="max-width:480px;padding:28px 32px;background:#1c1c1f;border:1px solid #3a3a3f;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.5);">' + inner + '</div>';
              document.body.appendChild(overlay);
              var btn = document.getElementById("bw-crash-reload");
              if (btn) btn.addEventListener("click", function () { window.location.reload(); });
            }
            function showNoWebGPU() {
              blockInput();
              try {
                panel(
                  '<div style="font-size:17px;font-weight:600;margin-bottom:10px;">This browser cannot run the editor yet</div>' +
                  '<div style="opacity:0.78;margin-bottom:18px;">It needs <b>WebGPU</b>, which is unavailable on this device. Try current desktop Chrome or Edge on a machine with hardware WebGPU enabled (chrome://gpu lists it under WebGPU).</div>' +
                  '<button id="bw-crash-reload" style="background:#5b8cff;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;">Retry</button>');
              } catch (_) {}
            }
            function showRecoveryOverlay(reason) {
              if (recovered) return;
              recovered = true;
              if (window.__bwAdapterOK === false) { showNoWebGPU(); return; }
              blockInput();
              killTimers();
              // Self-heal a transient boot race once per 10 minutes; a
              // deterministic trap then lands on the panel instead of a loop.
              try {
                var last = parseInt(sessionStorage.getItem("bw-crash-reload-at") || "0", 10);
                if (Date.now() - last > 600000) {
                  sessionStorage.setItem("bw-crash-reload-at", String(Date.now()));
                  window.location.reload();
                  return;
                }
              } catch (_) {}
              try {
                var short = String(reason || "").split("\\n")[0].slice(0, 300);
                panel(
                  '<div style="font-size:17px;font-weight:600;margin-bottom:10px;">Blender hit an internal error</div>' +
                  '<div style="opacity:0.78;margin-bottom:10px;">This early WebAssembly build crashed and can\\'t safely continue. Reloading restarts it cleanly.</div>' +
                  '<div style="max-height:90px;overflow:auto;margin-bottom:18px;padding:8px 10px;background:#111;border:1px solid #2e2e33;border-radius:6px;font:11px/1.4 monospace;color:#ff9c9c;text-align:left;">' +
                  String(short).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }) + '</div>' +
                  '<button id="bw-crash-reload" style="background:#5b8cff;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;">Reload Blender</button>');
              } catch (_) {}
            }
            window.__bwCrashOverlay = showRecoveryOverlay;

            function report(kind, value) {
              try {
                var t = value && value.stack ? value.stack : String(value);
                console.error("[browser] " + kind + ": " + t);
                if (/memory access out of bounds|out of bounds memory access|table index is out of bounds|unreachable executed/i.test(t)) {
                  showRecoveryOverlay(kind + ": " + t);
                }
              } catch (_) {}
            }
            window.addEventListener("error", function (e) { report("error", e.error || e.message); });
            window.addEventListener("unhandledrejection", function (e) { report("unhandled rejection", e.reason); });
          })();
          </script>'''
          anchor = '<script src="./diagnostics-bootstrap.js">'
          if anchor not in text:
              raise SystemExit("diagnostics-bootstrap anchor missing; refusing to publish a partial fix")
          text = text.replace(anchor, hardening + '\n  ' + anchor, 1)
          p.write_text(text, encoding="utf-8")

          # The shipped v0.1.1 backend has a known browser blocker: legacy
          # GPU_SELECT_NEAREST_* uses a synchronous occlusion-query readback.
          # WebGPU query mapping completes only after the worker yields, so the
          # native Blender selection operator reports "webgpu selection readback
          # failed" - and on this build, sometimes traps with an out-of-bounds
          # wasm memory access instead of failing cleanly. Two mitigations, both
          # scoped as narrowly as possible:
          #   1. Replace only the simple Object Mode click-select binding with a
          #      CPU scene ray-cast, so a plain click never reaches GPU_SELECT.
          #   2. Turn off the on-screen move/rotate/scale gizmo. Its hover
          #      highlight also calls into the same buggy GPU_SELECT path on
          #      every mouse-move near the widget (no click needed), which is
          #      the most likely cause of a crash within seconds of orbiting
          #      near an object. G/R/S keyboard transforms keep working; only
          #      the draggable on-canvas handles are hidden.
          # Drag/box selection, navigation, edit-mode selection, and the
          # renderer remain untouched.
          boot = Path("site/boot-windowed.js")
          boot_text = boot.read_text(encoding="utf-8")

          # (3) LOG CAP: the binary prints stdout/stderr line-by-line into a hidden
          #     <pre id="log">, one DOM span each, with no cap. Warning storms
          #     grow the DOM by thousands of nodes over minutes -> progressive
          #     slowdown. Keep the newest 200 spans.
          append_old = 'function append(text, cls) {\n  if (!logEl) return;\n  const span = document.createElement("span");'
          append_new = 'function append(text, cls) {\n  if (!logEl) return;\n  while (logEl.firstChild && logEl.childNodes.length >= 200) logEl.removeChild(logEl.firstChild);\n  const span = document.createElement("span");'
          if append_old not in boot_text:
              raise SystemExit("append anchor missing; refusing to publish a partial fix")
          boot_text = boot_text.replace(append_old, append_new, 1)

          # (4) CONSOLE THROTTLE: same spam also fires console.log/error per line.
          #     After the first 300 lines only every 200th is mirrored; the DOM
          #     log and BWFileBridge still see every line.
          print_old = '    print: (line) => {\n      console.log(line);'
          print_new = '    print: (line) => {\n      __bwConsole("log", line);'
          printerr_old = '    printErr: (line) => {\n      console.error(line);'
          printerr_new = '    printErr: (line) => {\n      __bwConsole("error", line);'
          if print_old not in boot_text or printerr_old not in boot_text:
              raise SystemExit("print/printErr anchors missing; refusing to publish a partial fix")
          boot_text = boot_text.replace(print_old, print_new, 1)
          boot_text = boot_text.replace(printerr_old, printerr_new, 1)

          gate_marker = 'const GATE = gateMode();'
          if gate_marker not in boot_text:
              raise SystemExit("gate anchor missing; refusing to publish a partial fix")
          boot_text = boot_text.replace(gate_marker,
              'const GATE = gateMode() || (window.__BW_GATE_DEFAULT || null);', 1)

          # (2) DPR CAP (full-window perf: every wasm frame renders backing pixels).
          #     The unpatched shell renders at raw devicePixelRatio; on a 4K/HiDPI
          #     display that is 2x+ the pixels per frame of a 1080p window and is the
          #     single biggest controllable per-frame cost while staying full-window.
          #     Default cap 1.25 (sharper is a ?dpr= query away: ?dpr=0 = native
          #     uncapped, ?dpr=N = exact value). Both DPR reads in the shell funnel
          #     through the same source line, so one anchored replace covers boot and
          #     resize; a second replace covers the boot-time resize probe.
          dpr_helper = '''
          // [pages-hardening] DPR cap for full-window frame cost (see workflow).
          (function () {
            var cap = 1.25;
            try {
              var q = new URLSearchParams(location.search).get("dpr");
              if (q === "0") { cap = 0; }
              else if (q) { cap = Math.min(3, Math.max(0.5, parseFloat(q))); }
            } catch (_) {}
            window.__BW_DPR_CAP = cap;
          })();
          function shellDpr(native) {
            var cap = window.__BW_DPR_CAP;
            if (!cap) return native;
            return Math.min(native, cap);
          }
          // [pages-hardening] console spam throttle (see print/printErr patch).
          function __bwConsole(method, line) {
            var seen = (window.__bwConsoleSeen = (window.__bwConsoleSeen || 0) + 1);
            if (seen <= 300 || seen % 200 === 0) {
              try { console[method](line); } catch (_) {}
            }
          }
          // [pages-hardening] resolution scale: renders the backing store at
          // scale * cssPx and lets CSS stretch edge-to-edge. Wasm frame cost
          // scales with backing pixels. ?scale=N (0.4-1.5) overrides and
          // persists in localStorage; default 0.85.
          (function () {
            var scale = null;
            try {
              var q = new URLSearchParams(location.search).get("scale");
              if (q) {
                scale = Math.min(1.5, Math.max(0.4, parseFloat(q)));
                try { localStorage.setItem("bw-scale", String(scale)); } catch (_) {}
              } else {
                scale = parseFloat(localStorage.getItem("bw-scale"));
              }
            } catch (_) {}
            window.__BW_SCALE = (scale && isFinite(scale)) ? scale : 0.85;
          })();
          const GATE = gateMode() || (window.__BW_GATE_DEFAULT || null);'''
          boot_text = boot_text.replace('const GATE = gateMode() || (window.__BW_GATE_DEFAULT || null);',
              dpr_helper, 1)
          dpr_marker = 'const dpr = window.devicePixelRatio || 1;'
          dpr_count = boot_text.count(dpr_marker)
          if dpr_count != 2:
              raise SystemExit(f"expected exactly 2 DPR reads, found {dpr_count}; refusing a partial patch")
          boot_text = boot_text.replace(dpr_marker,
              'const dpr = shellDpr(window.devicePixelRatio || 1);')

          # (5) RESOLUTION SCALE: multiply both backing extents by __BW_SCALE.
          backing_boot_old = '    w: Math.max(1, Math.round(cssW * dpr)),\n    h: Math.max(1, Math.round(cssH * dpr)),'
          backing_boot_new = '    w: Math.max(1, Math.round(cssW * dpr * (window.__BW_SCALE || 1))),\n    h: Math.max(1, Math.round(cssH * dpr * (window.__BW_SCALE || 1))),'
          backing_resize_old = '    const w = Math.max(1, Math.round(window.innerWidth * dpr));\n    const h = Math.max(1, Math.round(window.innerHeight * dpr));'
          backing_resize_new = '    const w = Math.max(1, Math.round(window.innerWidth * dpr * (window.__BW_SCALE || 1)));\n    const h = Math.max(1, Math.round(window.innerHeight * dpr * (window.__BW_SCALE || 1)));'
          if backing_boot_old not in boot_text or backing_resize_old not in boot_text:
              raise SystemExit("backing-extent anchors missing; refusing to publish a partial fix")
          boot_text = boot_text.replace(backing_boot_old, backing_boot_new, 1)
          boot_text = boot_text.replace(backing_resize_old, backing_resize_new, 1)

          abort_old = '    onAbort: (what) => {\n      append("[shell] onAbort: " + what, "err");\n      finish("aborted", "aborted", undefined);\n    },'
          abort_new = '    onAbort: (what) => {\n      append("[shell] onAbort: " + what, "err");\n      if (window.__bwCrashOverlay) { try { window.__bwCrashOverlay("Blender aborted: " + what); } catch (_) {} }\n      finish("aborted", "aborted", undefined);\n    },'
          if abort_old not in boot_text:
              raise SystemExit("onAbort anchor missing; refusing to publish a partial fix")
          boot_text = boot_text.replace(abort_old, abort_new, 1)

          exit_old = '    onExit: (code) => {\n      append("[shell] process exited, code " + code, "sys");\n      finish(code === 0 ? "exited" : "aborted", "exited (" + code + ")", code);\n    },'
          exit_new = '    onExit: (code) => {\n      append("[shell] process exited, code " + code, "sys");\n      if (code !== 0 && window.__bwCrashOverlay) { try { window.__bwCrashOverlay("Blender exited with code " + code); } catch (_) {} }\n      finish(code === 0 ? "exited" : "aborted", "exited (" + code + ")", code);\n    },'
          if exit_old not in boot_text:
              raise SystemExit("onExit anchor missing; refusing to publish a partial fix")
          boot_text = boot_text.replace(exit_old, exit_new, 1)

          fallback_py = '''import bpy
          from bpy_extras import view3d_utils

          class BWWebSelect(bpy.types.Operator):
              bl_idname = "view3d.bw_web_select"
              bl_label = "Web Object Select"

              @classmethod
              def poll(cls, context):
                  return bool(context.area and context.area.type == 'VIEW_3D' and context.mode == 'OBJECT' and context.region_data)

              def invoke(self, context, event):
                  region = context.region
                  rv3d = context.region_data
                  coord = (event.mouse_region_x, event.mouse_region_y)
                  direction = view3d_utils.region_2d_to_vector_3d(region, rv3d, coord)
                  origin = view3d_utils.region_2d_to_origin_3d(region, rv3d, coord)
                  hit, location, normal, index, obj, matrix = context.scene.ray_cast(context.view_layer.depsgraph, origin, direction)
                  if event.shift or event.ctrl:
                      if hit and obj:
                          if event.ctrl:
                              obj.select_set(False)
                          else:
                              obj.select_set(not obj.select_get())
                          if obj.select_get():
                              context.view_layer.objects.active = obj
                  else:
                      for selected in context.selected_objects:
                          selected.select_set(False)
                      if hit and obj:
                          obj.select_set(True)
                          context.view_layer.objects.active = obj
                  return {'FINISHED'}

          bpy.utils.register_class(BWWebSelect)
          wm = bpy.context.window_manager
          km = wm.keyconfigs.active.keymaps.get('3D View') if wm.keyconfigs.active else None
          if km:
              for shift, ctrl in ((False,False),(True,False),(False,True),(True,True)):
                  km.keymap_items.new('view3d.bw_web_select', 'LEFTMOUSE', 'CLICK', shift=shift, ctrl=ctrl, head=True)

          for screen in bpy.data.screens:
              for area in screen.areas:
                  if area.type == 'VIEW_3D':
                      for space in area.spaces:
                          if space.type == 'VIEW_3D':
                              space.show_gizmo = False
          '''
          fallback_expr = "exec(" + repr(fallback_py) + ")"
          marker = 'const ARGV = [\n  "--factory-startup",\n];'
          injected = 'const ARGV = [\n  "--factory-startup",\n  "--python-expr",\n  ' + json.dumps(fallback_expr) + ',\n];'
          if marker in boot_text:
              boot_text = boot_text.replace(marker, injected, 1)
          else:
              raise SystemExit("Could not find the windowed ARGV block; refusing to publish a partial fix")
          boot.write_text(boot_text, encoding="utf-8")

          for p in Path("site").rglob("*.js"):
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              text = text.replace('const BIN_PREFIX = "/bin/";', 'const BIN_PREFIX = new URL("./bin/", document.baseURI).href;')
              text = text.replace('"/bin/', '"./bin/').replace("'/bin/", "'./bin/")
              text = text.replace('"/boot.js"', '"./boot.js"').replace("'/boot.js'", "'./boot.js'")
              p.write_text(text, encoding="utf-8")
          PY

      - name: Verify the actual interactive launcher and crash mitigations
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/windowed.html
          test -f site/boot-windowed.js
          test -f site/bin/blender_browser.js
          grep -q '<base href="./">' site/index.html
          grep -q 'src="./boot-windowed.js"' site/index.html
          grep -q 'const ARGV = \[' site/boot-windowed.js
          grep -q '"--factory-startup"' site/boot-windowed.js
          grep -q '"--python-expr"' site/boot-windowed.js
          grep -q 'view3d.bw_web_select' site/boot-windowed.js
          grep -q 'context.scene.ray_cast' site/boot-windowed.js
          grep -q 'show_gizmo = False' site/boot-windowed.js
          grep -q 'const GATE = gateMode() || (window.__BW_GATE_DEFAULT || null);' site/boot-windowed.js
          grep -q 'shellDpr(window.devicePixelRatio || 1)' site/boot-windowed.js
          grep -q 'logEl.childNodes.length >= 200' site/boot-windowed.js
          grep -q '__bwConsole("error", line)' site/boot-windowed.js
          grep -q '__BW_SCALE || 1' site/boot-windowed.js
          grep -q '__bwCrashOverlay' site/boot-windowed.js
                    grep -q 'bw-crash-overlay' site/index.html
          grep -q 'Reload Blender' site/index.html
          ! grep -q 'id="run" class="' site/index.html
          node -c site/boot-windowed.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          overlay = [s for s in scripts if "bw-crash-overlay" in s]
          assert overlay, "hardening script missing"
          Path("/tmp/overlay-check.js").write_text(overlay[0], encoding="utf-8")
          PY
          node -c /tmp/overlay-check.js
          echo "Verified: interactive launcher, default gate mode, crash overlay + worker-abort wiring, WebGPU-safe selection and gizmo mitigation"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
