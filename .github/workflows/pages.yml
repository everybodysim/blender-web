name: Deploy Blender Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hardware-verified Blender Web release
        run: |
          curl -fL --retry 3 "https://github.com/gessa-ai/blender-web/releases/download/v0.1.1/blender-web-local-v0.1.1.tar.gz" -o blender-web.tar.gz
          echo "1af405cd00d3471e105a39dad24a628aeb988f77b372c4c21bbf85ccbdca2ee0  blender-web.tar.gz" | sha256sum -c -

      - name: Extract release and assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf unpack site
          mkdir unpack site
          tar -xzf blender-web.tar.gz -C unpack
          SHELL_DIR="$(find unpack -type d -name shell -print -quit)"
          test -n "$SHELL_DIR" && test -f "$SHELL_DIR/index.html"
          RELEASE_ROOT="$(dirname "$SHELL_DIR")"
          cp -a "$SHELL_DIR/." site/
          if [[ -d "$RELEASE_ROOT/bin" ]]; then cp -a "$RELEASE_ROOT/bin" site/bin; fi
          for dir in assets data lib wasm; do
            if [[ -d "$RELEASE_ROOT/$dir" && ! -e "site/$dir" ]]; then cp -a "$RELEASE_ROOT/$dir" "site/$dir"; fi
          done
          test -f site/index.html
          test -d site/bin
          test -f site/boot.js

      - name: Install COOP/COEP service worker correctly
        run: |
          cp coi-serviceworker.js site/coi-serviceworker.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          text = text.replace('<script src="./coi-serviceworker.js"></script>', '')
          registration = '''<script>
          (function () {
            if (!window.isSecureContext || !('serviceWorker' in navigator)) return;
            navigator.serviceWorker.register('./coi-serviceworker.js', {scope: './'})
              .then(function () {
                if (!navigator.serviceWorker.controller) window.location.reload();
              })
              .catch(function (err) { console.error('COOP/COEP service worker registration failed:', err); });
          })();
          </script>'''
          if 'navigator.serviceWorker.register' not in text:
              text = text.replace('</head>', registration + '\n</head>', 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Fix GitHub Pages relative runtime paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path("site/index.html")
          text = index.read_text(encoding="utf-8")
          for old, new in {
              '<script src="/boot.js"></script>': '<script src="./boot.js"></script>',
              '<script src="/bin/blender_browser.js"></script>': '<script src="./bin/blender_browser.js"></script>',
              'href="/favicon.ico"': 'href="./favicon.ico"',
          }.items(): text = text.replace(old, new)
          index.write_text(text, encoding="utf-8")
          for p in Path("site").rglob("*.js"):
              try: text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError: continue
              text = text.replace('const BIN_PREFIX = "/bin/";', 'const BIN_PREFIX = new URL("./bin/", document.baseURI).href;')
              text = text.replace('"/bin/', '"./bin/').replace("'/bin/", "'./bin/")
              text = text.replace('"/boot.js"', '"./boot.js"').replace("'/boot.js'", "'./boot.js'")
              p.write_text(text, encoding="utf-8")
          PY

      - name: Switch the shell from diagnostic boot to real interactive Blender
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = []
          for p in Path("site").rglob("*.js"):
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "BPY_OK" in text:
                  files.append(p)

          if len(files) != 1:
              raise SystemExit(f"Expected exactly one JS file containing BPY_OK, found {[str(p) for p in files]}")

          p = files[0]
          text = p.read_text(encoding="utf-8")
          original = text

          # v0.1.1 stores the launcher arguments in JavaScript rather than as
          # one contiguous command string. Remove the diagnostic --python-expr
          # argument pair, leaving the normal interactive Blender argv intact.
          patterns = [
              re.compile(r',\\s*([\"\'])--python-expr\\1\\s*,\\s*([\"\'])[^\\r\\n]*?BPY_OK[^\\r\\n]*?\\2'),
              re.compile(r'([\"\'])--python-expr\\1\\s*,\\s*([\"\'])[^\\r\\n]*?BPY_OK[^\\r\\n]*?\\2\\s*,'),
          ]
          for pattern in patterns:
              text, n = pattern.subn('', text, count=1)
              if n:
                  break

          # Also support the alternate form where the whole argv is a string.
          if text == original:
              text, n = re.subn(r'blender\\s+--factory-startup\\s+--python-expr\\s+[^\"\\']*BPY_OK[^\"\\']*', 'blender --factory-startup', text, count=1)
          else:
              n = 1

          if "BPY_OK" in text or n != 1:
              raise SystemExit("Could not safely remove the diagnostic BPY_OK launcher arguments")

          p.write_text(text, encoding="utf-8")
          print("Interactive Blender argv patched:", p)
          PY

      - name: Make the Blender canvas visible and interactive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          if 'id="canvas"' not in text:
              text = text.replace('<body>', '<body>\n    <canvas id="canvas" aria-hidden="true"></canvas>', 1)
          style = '''<style>
          html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
          #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; z-index: 9999; }
          </style>'''
          if '#canvas { position: fixed;' not in text:
              text = text.replace('</head>', style + '\n</head>', 1)
          marker = '<script src="./bin/blender_browser.js"></script>'
          bootstrap = '''<script>
          window.Module = window.Module || {};
          window.Module.canvas = document.getElementById('canvas');
          </script>'''
          if "window.Module.canvas = document.getElementById('canvas')" not in text and marker in text:
              text = text.replace(marker, bootstrap + '\n    ' + marker, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Patch Emscripten pthread canvas handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patched = []
          needle = 'pthread_create: could not find canvas with ID'
          old = '''if(name=="#canvas"){if(!Module["canvas"]){err(`pthread_create: could not find canvas with ID "${name}" to transfer to thread!`);error=28;break}name=Module["canvas"].id}'''
          new = '''if(name=="#canvas"){if(!Module["canvas"]){continue}name=Module["canvas"].id}'''
          for p in Path("site").rglob("*.js"):
              try: text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError: continue
              if needle in text and old in text:
                  p.write_text(text.replace(old, new, 1), encoding="utf-8")
                  patched.append(str(p))
          if len(patched) != 1:
              raise SystemExit(f"Expected exactly one Emscripten canvas handler, patched {len(patched)}: {patched}")
          print("Patched:", patched[0])
          PY

      - name: Verify generated Pages artifact
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/bin/blender_browser.js
          test -f site/boot.js
          grep -q "navigator.serviceWorker.register" site/index.html
          grep -q '<script src="./boot.js"></script>' site/index.html
          grep -q '<script src="./bin/blender_browser.js"></script>' site/index.html
          grep -q 'id="canvas"' site/index.html
          grep -q "window.Module.canvas = document.getElementById('canvas')" site/index.html
          grep -R 'if(name=="#canvas"){if(!Module\["canvas"\]){continue}name=Module\["canvas"\]\.id}' site --include='*.js'
          ! grep -R 'pthread_create: could not find canvas with ID' site --include='*.js'
          ! grep -R 'src="/bin/' site --include='*.html' --include='*.js'
          ! grep -R 'src="/boot.js"' site --include='*.html' --include='*.js'
          ! grep -R -- '--background' site --include='*.js'
          ! grep -R -- '--python-expr' site --include='*.js'
          ! grep -R -- 'BPY_OK' site --include='*.js'
          echo "Pages artifact checks passed"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
