name: Deploy Blender Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download hardware-verified Blender Web release
        run: |
          curl -fL --retry 3 \
            "https://github.com/gessa-ai/blender-web/releases/download/v0.1.1/blender-web-local-v0.1.1.tar.gz" \
            -o blender-web.tar.gz
          echo "1af405cd00d3471e105a39dad24a628aeb988f77b372c4c21bbf85ccbdca2ee0  blender-web.tar.gz" | sha256sum -c -

      - name: Extract release and assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf unpack site
          mkdir unpack site
          tar -xzf blender-web.tar.gz -C unpack

          SHELL_DIR="$(find unpack -type d -name shell -print -quit)"
          if [[ -z "$SHELL_DIR" || ! -f "$SHELL_DIR/index.html" ]]; then
            echo "Could not find release shell/index.html"
            find unpack -maxdepth 4 -type f | head -100
            exit 1
          fi

          RELEASE_ROOT="$(dirname "$SHELL_DIR")"
          cp -a "$SHELL_DIR/." site/

          # The release server normally serves shell/ and exposes its sibling
          # bin/ directory. Recreate that layout under the Pages document root.
          if [[ -d "$RELEASE_ROOT/bin" ]]; then
            cp -a "$RELEASE_ROOT/bin" site/bin
          fi

          # Preserve any additional sibling runtime directories shipped beside bin/.
          for dir in assets data lib wasm; do
            if [[ -d "$RELEASE_ROOT/$dir" && ! -e "site/$dir" ]]; then
              cp -a "$RELEASE_ROOT/$dir" "site/$dir"
            fi
          done

          test -f site/index.html
          test -d site/bin

      - name: Install COOP/COEP service worker
        run: |
          cp coi-serviceworker.js site/coi-serviceworker.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          marker = '<script src="./coi-serviceworker.js"></script>'
          if marker not in text:
              if "</head>" in text:
                  text = text.replace("</head>", f"    {marker}\n</head>", 1)
              else:
                  text = marker + "\n" + text
              p.write_text(text, encoding="utf-8")
          PY

      - name: Add GitHub Pages base-path compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/index.html")
          text = p.read_text(encoding="utf-8")
          if '<base href="./">' not in text and "<head>" in text:
              text = text.replace("<head>", '<head>\n    <base href="./">', 1)
              p.write_text(text, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
